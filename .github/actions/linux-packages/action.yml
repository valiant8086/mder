# Installs the packages mder builds with on Ubuntu (the README's list), and
# a virtual screen for starting mder, keeping the downloaded package files in
# GitHub's cache. Ubuntu's mirror has sometimes taken over 20 minutes to
# send them.
#
# The cache is named after the exact package files this run needs, so when
# Ubuntu updates one, the next run downloads it and saves a new cache; until
# then, nothing is downloaded. apt checks every cached file as usual. The
# regular checks and the release install the same list, so a release, which
# can only use caches saved on master, finds the checks' cache.
name: Linux build packages
description: Installs mder's Linux build packages, with the downloads cached.
runs:
  using: composite
  steps:
    - name: Update the package lists, and name the cache
      id: list
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        packages="build-essential cmake ninja-build pkg-config libclang-dev \
          libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libpng-dev libjpeg-dev libtiff-dev \
          libexpat1-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev xvfb dbus-x11"
        echo "packages=$(echo $packages)" >> "$GITHUB_OUTPUT"
        sudo apt-get update
        # The files a fresh install would download, by name and version.
        mkdir -p "$HOME/apt-files/partial"
        files=$(sudo apt-get install -y -qq --print-uris -o Dir::Cache::Archives="$HOME/apt-files" $packages | cut -d"'" -f2 | sort)
        echo "key=apt-${{ runner.os }}-${{ runner.arch }}-$(echo "$files" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v6
      id: restore
      with:
        path: ~/apt-files
        key: ${{ steps.list.outputs.key }}
    - name: Install the packages
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-files" ${{ steps.list.outputs.packages }}
        # apt makes them root's; the cache saves them as this user.
        sudo rm -rf "$HOME/apt-files/partial" "$HOME/apt-files/lock"
        sudo chown -R "$USER" "$HOME/apt-files"
        du -sh "$HOME/apt-files"
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/apt-files
        key: ${{ steps.list.outputs.key }}
