name: CI

on:
  push:
    branches: [master]
  pull_request:

# Every job has a time limit, so a stuck step fails instead of running for
# GitHub's default six hours.
jobs:
  # PCs and Windows on ARM. The release builds don't run the tests, so
  # every download's tests run here. Only the tests: the release workflow
  # builds the release. The build cache drops wxWidgets' build folder, which
  # holds WebView2LoaderStatic.lib; build.rs lets mder link without it.
  windows:
    strategy:
      # One build failing doesn't cancel the others, so each says how it did.
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Put Visual Studio's CMake and Ninja on the PATH
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
            $dir = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake'
            "$dir\CMake\bin" >> $env:GITHUB_PATH
            "$dir\Ninja" >> $env:GITHUB_PATH
          }
      - run: cargo test

  # An Apple silicon machine builds both halves of the app, and joins them
  # into one that runs on both. The Intel half runs under Rosetta here.
  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Make sure CMake and Ninja are available
        run: |
          command -v cmake || brew install cmake
          command -v ninja || brew install ninja
      - name: Install Rosetta, to run Intel code
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - run: cargo test
      - name: Test the Intel build, under Rosetta
        run: cargo test --target x86_64-apple-darwin
      - run: scripts/macos-app.sh --universal
      - name: Start each half of the app
        run: |
          scripts/smoke-test.sh target/universal/release/mder.app/Contents/MacOS/mder arm64
          scripts/smoke-test.sh target/universal/release/mder.app/Contents/MacOS/mder x86_64

  # Built on the oldest Ubuntu mder supports, so what it builds runs there
  # and on anything newer, for PCs and for ARM machines such as a Raspberry Pi.
  linux:
    strategy:
      # One build failing doesn't cancel the others, so each says how it did.
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install the build packages (the README's list), and a virtual screen
        timeout-minutes: 30
        uses: ./.github/actions/linux-packages
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
