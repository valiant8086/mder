name: CI

on:
  push:
    branches: [master]
  pull_request:

# Every job has a time limit, so a stuck step fails instead of running for
# GitHub's default six hours.
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Make sure Ninja is available
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y }
      - run: cargo test
      - run: cargo build --release

  # An Apple silicon machine builds both halves of the app, and joins them
  # into one that runs on both. The Intel half runs under Rosetta here.
  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Make sure CMake and Ninja are available
        run: |
          command -v cmake || brew install cmake
          command -v ninja || brew install ninja
      - name: Install Rosetta, to run Intel code
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - run: cargo test
      - name: Test the Intel build, under Rosetta
        run: cargo test --target x86_64-apple-darwin
      - run: scripts/macos-app.sh --universal
      - name: Start each half of the app
        run: |
          scripts/smoke-test.sh target/universal/release/mder.app/Contents/MacOS/mder arm64
          scripts/smoke-test.sh target/universal/release/mder.app/Contents/MacOS/mder x86_64

  # Built on the oldest Ubuntu mder supports, so what it builds runs there
  # and on anything newer, for PCs and for ARM machines such as a Raspberry Pi.
  linux:
    strategy:
      # One build failing doesn't cancel the others, so each says how it did.
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install the build packages (the README's list)
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libclang-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libpng-dev libjpeg-dev libtiff-dev \
            libexpat1-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
