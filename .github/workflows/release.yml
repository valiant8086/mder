# Pushing a tag like v0.1.0 builds mder for Windows and macOS, and publishes
# a GitHub release with both zips.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Make sure Ninja is available
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y }
      - run: cargo test
      - name: Build the release zip
        shell: pwsh
        run: ./scripts/dist.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  # One app for Apple silicon and Intel. It's signed for no one in
  # particular, so people allow it once in System Settings, Privacy &
  # Security, "Open Anyway".
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Make sure CMake and Ninja are available
        run: |
          command -v cmake || brew install cmake
          command -v ninja || brew install ninja
      - name: Install Rosetta, to run Intel code
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - run: cargo test
      - name: Test the Intel build, under Rosetta
        run: cargo test --target x86_64-apple-darwin
      - name: Build the release zip
        run: scripts/macos-app.sh --universal --zip
      - name: Start each half of the app
        run: |
          scripts/macos-smoke-test.sh target/universal/release/mder.app/Contents/MacOS/mder arm64
          scripts/macos-smoke-test.sh target/universal/release/mder.app/Contents/MacOS/mder x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --repo "${{ github.repository }}" --title "mder ${{ github.ref_name }}" --generate-notes
