# Pushing a tag like v0.1.0 builds mder and publishes a GitHub release with the zip.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Make sure Ninja is available
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y }
      - run: cargo test
      - name: Build the release zip
        shell: pwsh
        run: ./scripts/dist.ps1
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*.zip).FullName --title "mder ${{ github.ref_name }}" --generate-notes
